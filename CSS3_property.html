<!DOCTYPE html>
<html>
<head>
<style>
  table {
    border-collapse: collapse;
    margin: 20px auto;
    font-family: Arial, sans-serif;
  }
  th, td {
    border: 2px solid #999;
    padding: 8px 15px;
    text-align: center;
  }
  th {
    font-weight: bold;
  }
  caption {
    font-weight: bold;
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<table>
  <caption>CSS3 Browser Support (latest browser versions)</caption>
  <tr>
    <th>CSS Property</th>
    <th>Internet Explorer</th>
    <th>FireFox</th>
    <th>Chrome</th>
    <th>Safari</th>
    <th>Opera</th>
  </tr>
  <tr>
    <td>Border Radius</td>
    <td>YES</td>
    <td>YES</td>
    <td>YES</td>
    <td>YES</td>
    <td>YES</td>
  </tr>
  <tr>
    <td>Box Shadow</td>
    <td>YES</td>
    <td>YES</td>
    <td>YES</td>
    <td>YES</td>
    <td>YES</td>
  </tr>
  <tr>
    <td>CSS Animations</td>
    <td>NO</td>
    <td>NO</td>
    <td>YES</td>
    <td>YES</td>
    <td>NO</td>
  </tr>
</table>

</body>
</html>
