<!DOCTYPE html>
<html lang="en">
<head>
    <style>
    table {
    border-collapse: collapse;
    margin: 20px auto;
    background: green;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
  }
  td, th {
    border: 1px solid white;
    width: 50px;
    height: 40px;
  }
  .red { background: red; }
  .black { background: black; }
  .green { background: green; }
  .wide { height: 50px; }
</style>
</head>
<body>

    <td class="red">27</td>
    <td class="red">30</td>
    <td class="black">33</td>
    <td class="red">36</td>
    <td class="green">2 to 1</td>
  </tr>
  <tr>
    <td class="black">2</td>
    <td class="red">5</td>

    <td class="black">11</td>
    <td class="red">14</td>
    <td class="black">17</td>
    <td class="black">20</td>

    <td class="red">34</td>
    <td class="green">2 to 1</td>
  </tr>
  <tr class="wide">
    <td colspan="4">1st 12</td>
    <td colspan="4">2nd 12</td>
    <td colspan="4">3rd 12</td>
    <td colspan="2"></td>
  </tr>
  <tr class="wide">
    <td colspan="2">1 to 18</td>

</body>
</html>
